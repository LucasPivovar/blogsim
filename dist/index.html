<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BlogSim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root {
  --surface-0: #f5f6fa;
  --surface-100: #ffffff;
  --surface-200: #eceef5;
  --line: #d8dce9;
  --line-strong: #8a90ab;
  --ink: #121633;
  --ink-muted: #585e7e;
  --brand: #2a49de;
  --brand-hover: #2039b8;
  --on-brand: #ffffff;
  --brand-soft: #e5eaff;
  --accent: #f26a1b;
  --on-accent: #1d0d03;
  --accent-ink: #b4460a;
  --accent-soft: #ffeadc;
  --teal: #087357;
  --on-teal: #ffffff;
  --teal-soft: #dcf5ec;
  --success: #1d7f52;
  --success-soft: #def3e7;
  --warning: #8f5a00;
  --warning-soft: #fdf0d6;
  --danger: #b52f26;
  --danger-soft: #fde4e1;
  --focus-ring: #2a49de;
  --shadow-card: 0 1px 2px rgba(18,22,51,0.06), 0 2px 8px rgba(18,22,51,0.05);
  --shadow-pop: 0 12px 32px rgba(18,22,51,0.18);
  --font-display: Figtree, "Segoe UI", system-ui, sans-serif;
  --font-sans: Figtree, "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-pill: 999px;
}

body { margin: 0; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 22px; }
.bs-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; padding: var(--space-4); }
.bs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-4); padding: var(--space-4); }
.bs-stack { display: grid; gap: var(--space-3); padding: var(--space-4); }
.bs-btn:focus-visible, .bs-obj:focus-visible, .bs-nav-item:focus-visible, .bs-input-wrap:focus-within { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

/* Button */
.bs-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 40px; padding: 0 var(--space-4); border-radius: var(--radius-md); border: 1px solid transparent; font: 600 14px/1 var(--font-sans); cursor: pointer; white-space: nowrap; transition: background-color .15s, border-color .15s; }
.bs-btn-sm { height: 32px; padding: 0 var(--space-3); font-size: 13px; }
.bs-btn-primary { background: var(--brand); color: var(--on-brand); }
.bs-btn-primary:hover { background: var(--brand-hover); }
.bs-btn-accent { background: var(--accent); color: var(--on-accent); }
.bs-btn-accent:hover { filter: brightness(1.06); }
.bs-btn-secondary { background: var(--surface-100); color: var(--ink); border-color: var(--line-strong); }
.bs-btn-secondary:hover { background: var(--surface-200); }
.bs-btn-ghost { background: transparent; color: var(--brand); }
.bs-btn-ghost:hover { background: var(--brand-soft); }
.bs-btn:disabled { background: var(--surface-200); color: var(--ink-muted); border-color: transparent; cursor: not-allowed; filter: none; }
.bs-btn[aria-busy="true"] { cursor: progress; }
.bs-spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: bs-spin .7s linear infinite; }
@keyframes bs-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .bs-spin { animation-duration: 2.4s; } .bs-btn { transition: none; } }

/* Badge */
.bs-badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--radius-pill); font: 600 12px/1 var(--font-sans); white-space: nowrap; }
.bs-badge-dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.bs-badge-neutral { background: var(--surface-200); color: var(--ink); }
.bs-badge-brand { background: var(--brand-soft); color: var(--brand); }
.bs-badge-accent { background: var(--accent-soft); color: var(--accent-ink); }
.bs-badge-teal { background: var(--teal-soft); color: var(--teal); }
.bs-badge-success { background: var(--success-soft); color: var(--success); }
.bs-badge-warning { background: var(--warning-soft); color: var(--warning); }
.bs-badge-danger { background: var(--danger-soft); color: var(--danger); }

/* TextField */
.bs-field { display: grid; gap: 6px; min-width: 0; }
.bs-field-label { font: 600 13px/18px var(--font-sans); letter-spacing: .01em; color: var(--ink); }
.bs-input-wrap { display: flex; align-items: center; gap: var(--space-2); height: 40px; padding: 0 var(--space-3); border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface-100); }
.bs-input { flex: 1; min-width: 0; height: 100%; border: 0; padding: 0; background: transparent; color: var(--ink); font: 400 15px/22px var(--font-sans); outline: none; }
.bs-input::placeholder { color: var(--ink-muted); }
.bs-input-affix { color: var(--ink-muted); font: 500 14px/1 var(--font-sans); }
.bs-field-hint { font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
.bs-field-error .bs-input-wrap { border-color: var(--danger); }
.bs-field-error .bs-field-hint { color: var(--danger); font-weight: 500; }

/* MetricCard */
.bs-metric { display: grid; gap: var(--space-2); min-width: 0; padding: var(--space-4); background: var(--surface-100); border: 1px solid var(--line); border-radius: var(--radius-lg); }
.bs-metric-label { font: 600 13px/18px var(--font-sans); color: var(--ink-muted); }
.bs-metric-value { font: 600 30px/34px var(--font-sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--ink); }
.bs-metric-foot { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
.bs-metric-delta { font-weight: 600; font-variant-numeric: tabular-nums; }
.bs-metric-delta.is-good { color: var(--success); }
.bs-metric-delta.is-bad { color: var(--danger); }
.bs-spark { display: block; width: 100%; height: 40px; }
.bs-spark-area { fill: var(--brand-soft); }
.bs-spark-line { fill: none; stroke: var(--brand); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }

/* ObjectivePicker */
.bs-obj-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-3); }
.bs-obj { display: grid; gap: var(--space-2); justify-items: start; text-align: left; padding: var(--space-4); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); background: var(--surface-100); color: var(--ink); font: inherit; cursor: pointer; }
.bs-obj-visitas { --obj: var(--brand); --obj-on: var(--on-brand); --obj-soft: var(--brand-soft); --obj-ink: var(--brand); }
.bs-obj-conversas { --obj: var(--teal); --obj-on: var(--on-teal); --obj-soft: var(--teal-soft); --obj-ink: var(--teal); }
.bs-obj-vendas { --obj: var(--accent); --obj-on: var(--on-accent); --obj-soft: var(--accent-soft); --obj-ink: var(--accent-ink); }
.bs-obj:hover { border-color: var(--obj-ink); }
.bs-obj[aria-checked="true"] { border-color: var(--obj-ink); box-shadow: inset 0 0 0 1px var(--obj-ink); background: var(--obj-soft); }
.bs-obj-icon { display: grid; place-items: center; width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--obj); color: var(--obj-on); }
.bs-obj-title { font: 600 15px/22px var(--font-sans); }
.bs-obj-desc { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }
.bs-obj-track { font: 500 12px/16px var(--font-sans); color: var(--obj-ink); }

/* SlotCard */
.bs-slot { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); padding: var(--space-3); background: var(--surface-100); border: 1px solid var(--line); border-radius: var(--radius-lg); }
.bs-slot.is-selected { background: var(--brand-soft); border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
.bs-wf { flex: none; width: 66px; height: 52px; }
.bs-wf-page { fill: var(--surface-0); stroke: var(--line-strong); }
.bs-wf-text { fill: var(--line); }
.bs-wf-slot { fill: var(--accent); }
.bs-slot-body { flex: 1 1 180px; min-width: 0; display: grid; gap: 2px; }
.bs-slot-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.bs-slot-blog { margin: 0; font: 600 15px/22px var(--font-sans); color: var(--ink); }
.bs-slot-meta, .bs-slot-price { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }
.bs-slot-price strong { font: 700 15px/22px var(--font-sans); font-variant-numeric: tabular-nums; color: var(--accent-ink); }

/* CampaignTable */
.bs-table-wrap { overflow-x: auto; background: var(--surface-100); border: 1px solid var(--line); border-radius: var(--radius-lg); }
.bs-table { width: 100%; border-collapse: collapse; font: 400 14px/20px var(--font-sans); color: var(--ink); }
.bs-table th { text-align: left; padding: 10px 16px; font: 600 12px/16px var(--font-sans); letter-spacing: .01em; color: var(--ink-muted); border-bottom: 1px solid var(--line); white-space: nowrap; }
.bs-table td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
.bs-table tbody tr:last-child td { border-bottom: 0; }
.bs-table .num { text-align: right; font-family: var(--font-sans); font-size: 13px; font-variant-numeric: tabular-nums; }
.bs-table th.num { font-family: var(--font-sans); font-size: 12px; }
.bs-table-name { font-weight: 600; }
.bs-table-sub { font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.bs-table-empty { text-align: center; color: var(--ink-muted); padding: var(--space-8) var(--space-4); white-space: normal; }

/* SideNav */
.bs-nav { box-sizing: border-box; display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-4); width: 240px; min-height: 100%; padding: var(--space-6) var(--space-4); background: var(--surface-100); border-right: 1px solid var(--line); }
.bs-wordmark { font: 800 22px/1 var(--font-display); letter-spacing: -.03em; color: var(--ink); }
.bs-wordmark b { font-weight: 700; color: var(--brand); }
.bs-nav-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; width: 100%; }
.bs-nav-item { width: 100%; text-align: left; padding: 8px 12px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink-muted); font: 500 14px/20px var(--font-sans); cursor: pointer; }
.bs-nav-item:hover { background: var(--surface-200); color: var(--ink); }
.bs-nav-item[aria-current="page"] { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.bs-nav-user { margin-top: auto; display: flex; align-items: center; gap: var(--space-2); font: 500 13px/18px var(--font-sans); color: var(--ink); }
.bs-nav-avatar { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--surface-200); font-size: 12px; font-weight: 700; }
.bs-nav-role { position: relative; width: 100%; }
.bs-nav-role-btn { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); width: 100%; padding: 8px 10px 8px 8px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-0); color: var(--ink-muted); font: inherit; cursor: pointer; }
.bs-nav-role-btn:hover { border-color: var(--line-strong); color: var(--ink); }
.bs-nav-role-chev { flex: none; transition: transform .15s; }
.bs-nav-role-btn[aria-expanded="true"] .bs-nav-role-chev { transform: rotate(180deg); }
.bs-nav-role-menu { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; right: 0; min-width: 200px; display: grid; gap: 2px; margin: 0; padding: 4px; list-style: none; background: var(--surface-100); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-pop); }
.bs-nav-role-opt { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); width: 100%; padding: 6px 8px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--ink-muted); font: 500 12px/16px var(--font-sans); cursor: pointer; }
.bs-nav-role-opt:hover, .bs-nav-role-opt[aria-current="true"] { background: var(--surface-200); }
.bs-nav-role-btn:focus-visible, .bs-nav-role-opt:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.bs-nav-user { width: 100%; min-width: 0; }
.bs-nav-user span:last-child { min-width: 0; }
.bs-nav-avatar { flex: none; }
@media (prefers-reduced-motion: reduce) { .bs-nav-role-chev { transition: none; } }
.bs-table-blogs { max-width: 300px; white-space: normal; }

.bs-nav-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.bs-nav-logout { flex: 1 0 100%; padding: 8px 12px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink-muted); font: 500 14px/20px var(--font-sans); text-align: left; cursor: pointer; }
.bs-nav-logout:hover { background: var(--surface-200); color: var(--ink); }
.bs-nav-user:has(.bs-nav-logout) { flex-wrap: wrap; row-gap: var(--space-2); padding-top: var(--space-3); border-top: 1px solid var(--line); }
.bs-nav-logout:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.bs-slot-logo { display: inline-grid; place-items: center; flex: none; width: 24px; height: 24px; border-radius: var(--radius-sm); object-fit: cover; color: #ffffff; font: 800 10px/1 var(--font-sans); letter-spacing: .02em; }
.bs-slot-loc { display: flex; align-items: center; gap: 4px; font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }

/* Layout do protótipo BlogSim. Cores, tipos e componentes vêm do design system (design-system/). */
/* Visual claro e branco: fundo da página igual ao dos cards, separação só por bordas. */
:root { --surface-0: #ffffff; }
html, body { min-height: 100%; }
body { background: var(--surface-0); }
h1, h2, h3 { text-wrap: balance; }


/* Casca */
.app-root { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.app-shell { flex: 1; min-height: 0; display: flex; align-items: stretch; }
.app-side { position: relative; flex: none; display: flex; overflow-y: auto; }
.app-mobilebar, .app-backdrop, .app-drawer-close { display: none; }
.app-burger, .app-drawer-close { place-items: center; width: 40px; height: 40px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink); cursor: pointer; }
.app-burger { display: grid; }
.app-burger:hover, .app-drawer-close:hover { background: var(--surface-200); }
.app-burger:focus-visible, .app-drawer-close:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.app-drawer-close { position: absolute; top: max(16px, env(safe-area-inset-top, 0px)); right: 12px; z-index: 1; }
.app-side .bs-nav { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
.app-main { flex: 1; min-width: 0; overflow-y: auto; }
.app-content { max-width: 1200px; display: grid; align-content: start; gap: var(--space-6); padding-block: var(--space-8) 96px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }

.app-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--space-4); }
.app-head h1 { margin: 0; font: 800 28px/34px var(--font-display); letter-spacing: -.02em; color: var(--ink); }
.app-head p { margin: 4px 0 0; color: var(--ink-muted); }
.app-head-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); }

.app-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-4); }
.app-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: var(--space-4); align-items: start; }

.app-card { display: grid; gap: var(--space-3); min-width: 0; padding: var(--space-4); background: var(--surface-100); border: 1px solid var(--line); border-radius: var(--radius-lg); }
.app-card-head, .app-section-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-2); }
.app-card h2, .app-section h2 { margin: 0; font: 600 16px/22px var(--font-sans); color: var(--ink); }
.app-card p { margin: 0; color: var(--ink-muted); font-size: 14px; line-height: 20px; max-width: 65ch; }
.app-section { display: grid; gap: var(--space-3); min-width: 0; }

.app-filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-4); }
.app-filters .bs-field { flex: 0 1 280px; }
.app-chips { display: grid; gap: 6px; min-width: 0; }
.app-chips-label { font: 600 13px/18px var(--font-sans); color: var(--ink); }
.app-chips-row { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.app-chip { height: 32px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-pill); background: var(--surface-100); color: var(--ink); font: 500 13px/1 var(--font-sans); cursor: pointer; }
.app-chip:hover { background: var(--surface-200); }
.app-chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface-0); }
.app-chip:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

.app-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: var(--space-3); }
.app-empty { margin: 0; padding: var(--space-8) var(--space-4); text-align: center; color: var(--ink-muted); background: var(--surface-100); border: 1px dashed var(--line-strong); border-radius: var(--radius-lg); }

.app-cartbar { position: sticky; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 5; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); background: var(--surface-100); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); }

/* Assistente de campanha */
.app-steps { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); margin: 0; padding: 0; list-style: none; }
.app-steps li { display: flex; align-items: center; gap: var(--space-2); font: 500 13px/18px var(--font-sans); color: var(--ink-muted); }
.app-steps li span { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line-strong); font: 600 12px/1 var(--font-sans); }
.app-steps li.is-done span { background: var(--brand-soft); border-color: var(--brand-soft); color: var(--brand); }
.app-steps li.is-current { color: var(--ink); font-weight: 600; }
.app-steps li.is-current span { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.app-wizard-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--space-2); padding-top: var(--space-3); border-top: 1px solid var(--line); }
.app-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: var(--space-4); }
.app-error { margin: 0; color: var(--danger); font: 500 13px/18px var(--font-sans); }

.app-dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--space-2) var(--space-6); margin: 0; font-size: 14px; }
.app-dl dt { color: var(--ink-muted); }
.app-dl dd { margin: 0; color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }
.app-dl .money { color: var(--accent-ink); font-family: var(--font-sans); font-variant-numeric: tabular-nums; }

.app-code { display: flex; align-items: flex-start; gap: var(--space-2); min-width: 0; padding: var(--space-3); background: var(--surface-200); border-radius: var(--radius-md); }
.app-code pre { flex: 1; min-width: 0; margin: 0; overflow-x: auto; font: 400 13px/20px var(--font-mono); color: var(--ink); white-space: pre; }
.app-code-label { font: 600 13px/18px var(--font-sans); color: var(--ink); }

.app-ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; color: var(--ink); font-size: 14px; }
.app-note { margin: 0; color: var(--ink-muted); font: 400 12px/16px var(--font-sans); }
.app-money { color: var(--accent-ink); font-family: var(--font-sans); font-variant-numeric: tabular-nums; }
.app-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }

.app-review { display: grid; gap: 0; background: var(--surface-100); border: 1px solid var(--line); border-radius: var(--radius-lg); }
.app-review-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-top: 1px solid var(--line); }
.app-review-row:first-child { border-top: 0; }
.app-review-main { display: grid; gap: 2px; min-width: 0; }
.app-review-main b { font-weight: 600; }
.app-review-main span { color: var(--ink-muted); font-size: 13px; }

/* Gráfico */
.app-chart-box { min-width: 0; }
.app-chart { display: block; width: 100%; height: auto; }
.app-chart text { fill: var(--ink-muted); font: 400 11px var(--font-sans); font-variant-numeric: tabular-nums; }
.app-chart text.val { fill: var(--ink); font-weight: 600; }
.app-chart .grid { stroke: var(--line); stroke-width: 1; }
.app-chart .bar { fill: var(--brand); }
.app-chart .bar.last { fill: var(--accent); }

@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 14px); } }
.app-toast:not([hidden]) { animation: toast-in .35s cubic-bezier(.2, .9, .3, 1.3) both; }
@media (prefers-reduced-motion: reduce) { .app-toast:not([hidden]) { animation: none; } }
.app-toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 30; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 10px 16px; background: var(--ink); color: var(--surface-0); border-radius: var(--radius-md); box-shadow: var(--shadow-pop); font: 500 14px/20px var(--font-sans); }

/* Passo Anúncio */
.app-adstep { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: var(--space-6); align-items: start; }
.app-adform { display: grid; gap: var(--space-4); min-width: 0; }
.app-adpreview { display: grid; gap: var(--space-3); min-width: 0; }
.app-file { max-width: 100%; font: 400 13px/18px var(--font-sans); color: var(--ink-muted); }
.app-file::file-selector-button { margin-right: var(--space-3); padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface-100); color: var(--ink); font: 600 13px/1 var(--font-sans); cursor: pointer; }
.app-file:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: var(--radius-md); }
@media (max-width: 1000px) { .app-adstep { grid-template-columns: 1fr; } }

/* Prévia da página do blog */
.pv { margin: 0; min-width: 0; }
.pv-chrome { padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius-lg) var(--radius-lg) 0 0; background: var(--surface-200); color: var(--ink-muted); font: 400 12px/16px var(--font-sans); }
.pv-page { position: relative; overflow: hidden; display: grid; align-content: start; gap: var(--space-3); padding: var(--space-4); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 var(--radius-lg) var(--radius-lg); background: var(--surface-100); }
.pv-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--space-2); padding-bottom: var(--space-2); border-bottom: 1px solid var(--line); font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
.pv-head b { font: 700 15px/20px var(--font-sans); color: var(--ink); }
.pv-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(110px, 32%); gap: var(--space-4); }
.pv-post { display: grid; gap: 8px; align-content: start; min-width: 0; }
.pv-title { margin-bottom: 4px; font: 700 17px/1.25 var(--font-sans); color: var(--ink); }
.pv-line { height: 7px; border-radius: 4px; background: var(--surface-200); }
.pv-line:nth-child(3n) { width: 82%; }
.pv-line:nth-child(4n) { width: 64%; }
.pv-side { display: grid; gap: var(--space-3); align-content: start; min-width: 0; }
.pv-side-box { height: 56px; border-radius: var(--radius-sm); background: var(--surface-200); }
.pv-ad { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 10px; border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface-100); outline: 2px dashed var(--accent); outline-offset: 3px; }
.pv-ad.is-vertical { flex-direction: column; align-items: stretch; }
.pv-ad-img { flex: none; display: grid; place-items: center; width: 88px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--radius-sm); background: var(--accent-soft); color: var(--accent-ink); font: 600 11px/1 var(--font-sans); }
.pv-ad.is-vertical .pv-ad-img { width: 100%; }
.pv-ad.is-empty .pv-ad-img { background: var(--surface-200); color: var(--ink-muted); }
.pv-ad-body { display: grid; gap: 3px; min-width: 0; }
.pv-ad-tag { font: 600 10px/12px var(--font-sans); letter-spacing: .04em; color: var(--ink-muted); }
.pv-ad-title { font: 600 13px/17px var(--font-sans); color: var(--ink); overflow-wrap: anywhere; }
.pv-ad-text { font: 400 12px/16px var(--font-sans); color: var(--ink-muted); overflow-wrap: anywhere; }
.pv-ad-cta { justify-self: start; margin-top: 4px; padding: 5px 10px; border-radius: var(--radius-sm); background: var(--accent); color: var(--on-accent); font: 600 11px/1.2 var(--font-sans); }
.pv-overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: var(--space-4); background: rgba(18, 22, 51, .45); }
.pv-pop { position: relative; width: min(230px, 100%); padding: var(--space-2); border-radius: var(--radius-lg); background: var(--surface-100); box-shadow: var(--shadow-pop); }
.pv-pop .pv-ad { outline-offset: -2px; }
.pv-pop .pv-ad-img { width: 100%; height: 72px; aspect-ratio: auto; }
.pv-page:has(.pv-overlay) { min-height: 320px; }
.pv-close { position: absolute; top: -10px; right: -10px; z-index: 1; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--surface-100); box-shadow: var(--shadow-card); color: var(--ink); font: 600 16px/1 var(--font-sans); }
.pv-caption { margin-top: var(--space-2); font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
@media (max-width: 520px) { .pv-body { grid-template-columns: 1fr; } }
/* Site (landing) */
.lp-root { min-height: 100%; overflow-x: clip; background: var(--surface-100); }
.lp-wrap { max-width: 1160px; margin-inline: auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.lp-nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface-100); border-bottom: 1px solid var(--line); transition: box-shadow .3s, border-color .3s; }
.lp-nav.is-scrolled { border-bottom-color: transparent; box-shadow: var(--shadow-card); }
.w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .12em; margin-bottom: -.12em; }
.wi { display: inline-block; }
.app-step-body { display: grid; gap: var(--space-3); min-width: 0; }
.lp-nav-in { display: flex; align-items: center; gap: var(--space-6); padding-block: 12px; }
.lp-nav-in .bs-wordmark { margin-right: auto; }
.lp-links { display: flex; gap: var(--space-6); }
.lp-links a { color: var(--ink-muted); text-decoration: none; font: 500 14px/20px var(--font-sans); border-radius: var(--radius-sm); }
.lp-links a:hover { color: var(--ink); }
.lp-links a:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.lp-section h2, .lp-band h2, .lp-close h2 { margin: 0 0 12px; max-width: 22ch; font: 800 34px/1.1 var(--font-display); letter-spacing: -.03em; color: var(--ink); text-wrap: balance; }
.lp-section { padding-block: 88px 0; }
.lp-sub { margin: 0 0 28px; max-width: 60ch; font-size: 16px; line-height: 24px; color: var(--ink-muted); }

/* Hero */
.lp-hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 56px; align-items: center; padding-block: 64px 24px; }
.lp-hero-text { display: grid; gap: 24px; justify-items: start; }
.lp-hero-text p { margin: 0; max-width: 50ch; font-size: 18px; line-height: 28px; color: var(--ink-muted); }
.lp-hero h1 { margin: 0; max-width: 14ch; font: 800 54px/1.04 var(--font-display); letter-spacing: -.045em; color: var(--ink); }
.lp-slotword { white-space: nowrap; padding: 0 .14em; border: 3px dashed var(--accent); border-radius: .16em; background: var(--accent-soft); -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.lp-proof { font: 500 13px/18px var(--font-sans); color: var(--ink-muted); }

/* Ilustração de página de blog */
.mp { position: relative; display: grid; gap: 8px; align-content: start; min-width: 0; padding: 12px; overflow: hidden; background: var(--surface-100); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-card); }
.mp-top { display: flex; align-items: center; gap: 5px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.mp-top b { margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 700 11px/14px var(--font-sans); color: var(--ink); }
.mp-top i { flex: none; width: 14px; height: 4px; border-radius: 2px; background: var(--line); }
.mp-body { display: grid; grid-template-columns: minmax(0, 1fr) 34%; gap: 8px; }
.mp-post { display: grid; gap: 5px; align-content: start; }
.mp-h { margin-bottom: 2px; font: 700 11px/1.25 var(--font-sans); color: var(--ink); }
.mp-post > i { height: 4px; border-radius: 2px; background: var(--surface-200); }
.mp-post > i.s { width: 68%; }
.mp-side { display: grid; gap: 6px; align-content: start; }
.mp-side > i.box { height: 34px; border-radius: 6px; background: var(--surface-200); }
.mp-slot { display: grid; place-content: center; justify-items: center; gap: 2px; min-height: 24px; padding: 4px; border: 1.5px solid var(--accent); border-radius: 8px; background: var(--accent); color: var(--on-accent); font: 700 9px/1.1 var(--font-sans); letter-spacing: .05em; text-transform: uppercase; text-align: center; }
.mp-slot em { font: 600 9px/1.2 var(--font-sans); font-style: normal; letter-spacing: 0; text-transform: none; }
.mp-lateral { min-height: 74px; }
.mp-inline { margin-block: 2px; }
.mp-pop { position: absolute; inset: 0; display: grid; place-items: center; padding: 10% 16%; background: rgba(18, 22, 51, .22); }
.mp-pop .mp-slot { width: 100%; min-height: 64px; }
.mp.is-large { gap: 12px; padding: 20px; border-radius: 18px; }
.mp.is-large .mp-top b { font-size: 15px; line-height: 20px; }
.mp.is-large .mp-top i { width: 28px; height: 6px; }
.mp.is-large .mp-h { font-size: 18px; }
.mp.is-large .mp-post { gap: 9px; }
.mp.is-large .mp-post > i { height: 7px; border-radius: 4px; }
.mp.is-large .mp-side > i.box { height: 64px; }
.mp.is-large .mp-slot { min-height: 44px; font-size: 11px; }
.mp.is-large .mp-slot em { font-size: 13px; }
.mp.is-large .mp-lateral { min-height: 150px; }

/* Demonstração */
.lp-demo { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 56px; align-items: center; }
.lp-demo-text p { margin: 0 0 24px; max-width: 46ch; font-size: 16px; line-height: 24px; color: var(--ink-muted); }

/* Três jeitos de medir */
.lp-measures { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px; margin-top: 32px; }
.lp-measure { display: grid; gap: 8px; align-content: start; }
.lp-rule { height: 2px; margin-bottom: 12px; background: var(--ink); }
.lp-measure b { font: 700 18px/24px var(--font-sans); color: var(--ink); }
.lp-measure p { margin: 0; font-size: 15px; line-height: 22px; color: var(--ink-muted); }
.lp-eg { justify-self: start; margin-top: 4px; font: 600 13px/18px var(--font-sans); font-variant-numeric: tabular-nums; }
.lp-m-visitas .lp-eg { color: var(--brand); }
.lp-m-conversas .lp-eg { color: var(--teal); }
.lp-m-vendas .lp-eg { color: var(--accent-ink); }
.lp-ill { width: 72px; height: 56px; margin-bottom: 8px; }
.ill-page { fill: var(--surface-100); stroke: var(--line-strong); stroke-width: 1.5; }
.ill-line { fill: var(--line); }
.ill-brand { fill: var(--brand); }
.ill-edge { stroke: var(--surface-100); stroke-width: 1.5; stroke-linejoin: round; }
.ill-teal { fill: var(--teal); }
.ill-teal-soft { fill: var(--teal-soft); }
.ill-on { fill: var(--on-teal); }
.ill-accent { fill: var(--accent); }
.ill-check { fill: none; stroke: var(--on-accent); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* Para quem tem blog */
.lp-band { margin-top: 88px; padding-block: 72px; background: var(--surface-200); }
.lp-blogger { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: center; }
.lp-blogger p { margin: 0 0 20px; max-width: 50ch; font-size: 16px; line-height: 24px; color: var(--ink-muted); }
.lp-checks { display: grid; gap: 10px; margin: 0 0 28px; padding: 0; list-style: none; }
.lp-checks li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 22px; color: var(--ink); }
.lp-checks li::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: 8px; border-radius: 50%; background: var(--accent); }

/* Blogs parceiros */
.lp-blogs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); grid-auto-rows: 1fr; gap: 20px; }
.lp-blog { display: grid; grid-template-rows: auto auto 1fr; gap: 14px; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface-100); transition: border-color .2s, box-shadow .2s, transform .2s; }
.lp-blog:hover { border-color: var(--line-strong); box-shadow: var(--shadow-card); transform: translateY(-2px); }
.lp-blog-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.lp-blog-brand > div { display: grid; min-width: 0; }
.lp-blog-brand b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 700 16px/22px var(--font-sans); color: var(--ink); }
.lp-blog-brand > div > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.lp-blog-meta { display: grid; justify-items: start; gap: 8px; }
.lp-loc { display: inline-flex; align-items: center; gap: 4px; font: 500 13px/18px var(--font-sans); color: var(--ink); }
.lp-pill { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 12px; border-radius: var(--radius-pill); background: var(--brand-soft); color: var(--brand); font: 600 13px/1 var(--font-sans); white-space: nowrap; }
.lp-pill.is-place { background: var(--surface-200); color: var(--ink); }
.lp-blog-foot { display: grid; align-content: start; gap: 12px; padding-top: 14px; border-top: 1px solid var(--line); }
.lp-reach { display: grid; }
.lp-reach b { font: 800 24px/28px var(--font-sans); letter-spacing: -.02em; color: var(--ink); font-variant-numeric: tabular-nums; }
.lp-reach span { font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.lp-glyphs { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.lp-glyph { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/16px var(--font-sans); color: var(--ink-muted); white-space: nowrap; }
.lp-glyph svg { flex: none; }
@media (prefers-reduced-motion: reduce) { .lp-blog { transition: none; } .lp-blog:hover { transform: none; } }
.blog-logo { display: inline-grid; place-items: center; flex: none; width: 32px; height: 32px; border-radius: 8px; object-fit: cover; color: #ffffff; font: 800 12px/1 var(--font-sans); letter-spacing: .02em; }
.blog-logo.is-lg { width: 44px; height: 44px; border-radius: 12px; font-size: 15px; }

/* Fechamento */
.lp-close-wrap { padding-block: 96px 72px; }
.lp-close { display: grid; justify-items: start; gap: 4px; padding: 48px; border: 3px dashed var(--accent); border-radius: 24px; background: var(--accent-soft); }
.lp-close-tag { margin-bottom: 8px; font: 700 12px/16px var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); }
.lp-close p { margin: 0 0 24px; max-width: 52ch; font-size: 16px; line-height: 24px; color: var(--ink); }
.lp-foot { padding-block: 24px 40px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-muted); }

@media (max-width: 960px) {
  .lp-hero { grid-template-columns: 1fr; gap: 40px; }
  .lp-hero h1 { font-size: 48px; }
  .lp-demo, .lp-blogger { grid-template-columns: 1fr; gap: 40px; }
  .lp-measures { grid-template-columns: 1fr; gap: 32px; }
}
@media (max-width: 860px) {
  .lp-links { display: none; }
  .lp-hero { padding-block: 40px 8px; }
  .lp-hero h1 { font-size: 40px; }
  .lp-hero-text p { font-size: 16px; line-height: 24px; }
  .lp-section { padding-block: 64px 0; }
  .lp-section h2, .lp-band h2, .lp-close h2 { font-size: 28px; }
  .lp-band { margin-top: 64px; padding-block: 56px; }
  .lp-close { padding: 28px 22px; }
}

/* Animação do topo da landing */
.hd { display: grid; gap: var(--space-3); min-width: 0; }
.hd-frame { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface-100); box-shadow: var(--shadow-card); }
.hd-chrome { padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface-200); color: var(--ink-muted); font: 400 12px/16px var(--font-sans); }
.hd-stage { position: relative; height: 360px; }
.hd-scene { position: absolute; inset: 0; opacity: 0; transform: translateY(8px); transition: opacity .45s ease, transform .45s ease; }
.hd-scene.is-on { opacity: 1; transform: none; }
.hd-panel { display: grid; align-content: start; gap: var(--space-3); padding: var(--space-4); }
.hd-title { font: 700 17px/24px var(--font-sans); color: var(--ink); }
.hd-chips { display: flex; gap: 6px; }
.hd-chip { padding: 5px 10px; border: 1px solid var(--line-strong); border-radius: var(--radius-pill); font: 500 12px/1 var(--font-sans); color: var(--ink); }
.hd-chip.is-on { background: var(--ink); border-color: var(--ink); color: var(--surface-100); }
.hd-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3); border: 1px solid var(--line); border-radius: var(--radius-md); transition: background-color .3s, border-color .3s; }
.hd-row.is-sel { background: var(--brand-soft); border-color: var(--brand); }
.hd-row-main { display: grid; gap: 1px; min-width: 0; font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.hd-row-main b { font-size: 14px; line-height: 20px; color: var(--ink); }
.hd-btn { flex: none; display: inline-grid; place-items: center; height: 32px; padding: 0 12px; border-radius: var(--radius-md); border: 1px solid transparent; font: 600 12px/1 var(--font-sans); transition: transform .12s, box-shadow .12s; }
.hd-btn.is-accent { background: var(--accent); color: var(--on-accent); }
.hd-btn.is-secondary { background: var(--surface-100); border-color: var(--line-strong); color: var(--ink); }
.hd-btn.is-wide { justify-self: start; height: 40px; padding: 0 16px; font-size: 13px; }
.hd-btn.is-pressed { transform: scale(.95); box-shadow: 0 0 0 4px var(--accent-soft); }
.hd-field { display: grid; gap: 6px; font: 600 12px/16px var(--font-sans); color: var(--ink); }
.hd-input { display: flex; align-items: center; height: 38px; padding: 0 12px; border: 1px solid var(--focus-ring); border-radius: var(--radius-md); font: 400 14px/1 var(--font-sans); color: var(--ink); white-space: nowrap; overflow: hidden; }
.hd-caret { width: 1px; height: 18px; margin-left: 1px; background: var(--ink); animation: hd-blink 1s steps(1) infinite; }
.hd-toast { justify-self: start; padding: 8px 12px; border-radius: var(--radius-md); background: var(--success-soft); color: var(--success); font: 600 13px/18px var(--font-sans); animation: hd-pop .35s ease both; }
.hd-blog { position: absolute; inset: 0; border: 0; border-radius: 0; }
.hd .pv-body { grid-template-columns: minmax(0, 1fr) minmax(120px, 38%); }
.hd .pv-ad { outline: 0; }
.hd-slot { height: 190px; border: 1px dashed var(--line-strong); background: transparent; }
.hd-ad-in { animation: hd-pop .5s ease both; border-radius: var(--radius-md); transition: box-shadow .15s, transform .15s; }
.hd-ad-in.is-clicked { transform: scale(.97); box-shadow: 0 0 0 4px var(--accent-soft); }
.hd-sale { position: absolute; top: 56px; right: 16px; padding: 6px 10px; border-radius: var(--radius-pill); background: var(--success-soft); color: var(--success); font: 700 12px/16px var(--font-sans); box-shadow: var(--shadow-card); animation: hd-pop .35s ease both; }
.hd-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-2) var(--space-4); }
.hd-steps { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0; padding: 0; list-style: none; counter-reset: hd; }
.hd-steps li { counter-increment: hd; font: 500 12px/18px var(--font-sans); color: var(--ink-muted); transition: color .3s; }
.hd-steps li::before { content: counter(hd) ". "; }
.hd-steps li.is-done { color: var(--ink-muted); }
.hd-steps li.is-on { color: var(--brand); font-weight: 700; }
.hd-pause { padding: 4px 10px; border: 1px solid var(--line-strong); border-radius: var(--radius-pill); background: var(--surface-100); color: var(--ink); font: 600 12px/16px var(--font-sans); cursor: pointer; }
.hd-pause:hover { background: var(--surface-200); }
.hd-pause:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
@keyframes hd-pop { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes hd-blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .hd-scene, .hd-row, .hd-btn, .hd-ad-in, .hd-steps li { transition: none; }
  .hd-toast, .hd-sale, .hd-ad-in { animation: none; }
  .hd-caret { animation: none; }
}

    if (step === 'sent') body = h(React.Fragment, null,
      h('h1', null, 'Cadastro enviado'),
      h('p', { className: 'lg-text', role: 'status' }, 'Recebemos o cadastro ', isBlog ? 'do blog ' : 'da empresa ', h('b', null, isBlog ? f.blog.trim() : f.company.trim()), '. A equipe do BlogSim analisa em até 24 horas e responde no e-mail ', h('b', null, email), '.'),
      h('p', { className: 'lg-text' }, isBlog ? 'Depois da aprovação, você entra e instala o script no blog para liberar o painel.' : 'Depois da aprovação, você entra, adiciona saldo e cria a primeira campanha.'),
      h(B.Button, { className: 'lg-submit', onClick: onBack }, 'Voltar para o site'));

    return h('main', { className: 'lg' + (step === 'form' ? ' is-signup' : ''), ref },
      h('div', { className: 'lg-card' },
        h('button', { type: 'button', className: 'lg-home', onClick: onBack, 'aria-label': 'Ir para o site do BlogSim' }, Wordmark()),
        h('div', { className: 'lg-body', ref: bodyRef }, body)),
      h(AuthArt));
  }
  // ---------- App ----------
  function App() {
    const [screen, setScreen] = useState(() => { try { return { '#entrar': 'login', '#cadastro': 'cadastro' }[location.hash] || 'site'; } catch (e) { return 'site'; } });
    const [signupRole, setSignupRole] = useState(null);
    const [users, setUsers] = useState(SEED_USERS);
    const [meId, setMeId] = useState(null);
    const [role, setRole] = useState('anunciante');
    const [page, setPage] = useState('Painel');
    const [campaigns, setCampaigns] = useState(INITIAL_CAMPAIGNS);
    const [cart, setCart] = useState([]);
    // Saldo e extrato por anunciante (a conta de QA começa com dados de exemplo; uma conta nova começa zerada).
    const [advBal, setAdvBal] = useState({ [ME]: 3000 });
    const [advTxns, setAdvTxns] = useState({ [ME]: INITIAL_TXNS });
    const [payouts, setPayouts] = useState(INITIAL_PAYOUTS);
    const [blogs, setBlogs] = useState(BLOGS.map(b => ({ ...b, slots: b.slots.length, status: b.status || 'ativo' })));
    const [pct, setPct] = useState(20);
    // Regras de recarga definidas pelo admin: mínimo, valor a partir do qual o cartão parcela e máximo de parcelas.
    const [billing, setBilling] = useState({ min: 100, installFrom: 500, maxInstallments: 6 });
    // Blogueiro logado: só vê o painel completo depois de verificar o script.
    const [blogger, setBlogger] = useState({ blogId: 'b1', fresh: false, verified: true });
    const [slotsByBlog, setSlotsByBlog] = useState({ b1: INITIAL_MY_SLOTS });
    const [balByBlog, setBalByBlog] = useState({ b1: 1640 });
    const [toast, setToast] = useState(null);
    const [menuOpen, setMenuOpen] = useState(false);

    const me = users.find(u => u.id === meId) || null;
    const advertiser = me && me.company ? me.company.name : ME;
    const balance = advBal[advertiser] || 0;
    const txns = advTxns[advertiser] || [];
    const myBlog = blogs.find(b => b.id === blogger.blogId) || blogs[0];
    const mySlots = slotsByBlog[blogger.blogId] || [];
    const setMySlots = fn => setSlotsByBlog(m => ({ ...m, [blogger.blogId]: typeof fn === 'function' ? fn(m[blogger.blogId] || []) : fn }));
    const bloggerBalance = balByBlog[blogger.blogId] || 0;
    const pendingSignups = users.filter(u => u.role !== 'admin' && u.status === 'pendente').length;

    const sideRef = React.useRef(null);
    useMotion(sideRef, (g, root) => {
      g.from(root.querySelectorAll('.bs-wordmark, .bs-nav > .bs-badge, .bs-nav-item, .bs-nav-user'), { x: -12, opacity: 0, stagger: .035, duration: .45, ease: 'power3.out' });
    }, [screen, role, blogger.verified]);

    const notify = msg => setToast({ msg, k: Date.now() });
    useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 3200); return () => clearTimeout(t); }, [toast]);
    useEffect(() => { if (!menuOpen) return; const f = e => { if (e.key === 'Escape') setMenuOpen(false); }; document.addEventListener('keydown', f); return () => document.removeEventListener('keydown', f); }, [menuOpen]);

    const top = () => { try { window.scrollTo(0, 0); } catch (e) {} };
    const go = p => { setMenuOpen(false); setPage(p); top(); };
    const toSite = () => { setScreen('site'); top(); };
    function openLogin() { setScreen('login'); top(); }
    function openSignup(r) { setSignupRole(r || null); setScreen('cadastro'); top(); }

    function login(u) {
      let start = START_PAGE[u.role];
      if (u.role === 'blogueiro') {
        const verified = !!u.scriptVerified;
        setBlogger({ blogId: u.blogId, fresh: u.id !== 'u-blog', verified });
        if (!verified) start = 'Instalar script';
      }
      setMeId(u.id); setRole(u.role); setPage(start); setMenuOpen(false); setScreen('app'); top();
    }
    function logout() { setMenuOpen(false); setMeId(null); setScreen('site'); top(); notify('Você saiu da sua conta.'); }

    // Cadastro: a conta nasce em análise. O blog do blogueiro também, até o admin aprovar.
    function signup(d) {
      const id = 'u' + Date.now(), salt = newSalt();
      const user = { id, role: d.role, name: d.name.trim(), email: d.email, salt, hash: passHash(salt, d.pw), status: 'pendente', createdAt: TODAY };
      if (d.role === 'blogueiro') {
        user.blogId = 'b' + Date.now();
        setBlogs(list => [...list, { id: user.blogId, name: d.blog.trim(), niche: d.niche, owner: user.name, audience: parseInt(String(d.audience).replace(/\D/g, ''), 10) || 0, city: d.city.trim(), uf: d.uf, color: '#2a49de', site: d.site.trim(), logo: d.logo, desc: '', slots: 0, status: 'pendente' }]);
      } else {
        user.company = { name: d.company.trim(), legal: d.legal.trim(), cnpj: d.cnpj, site: d.site.trim(), phone: d.phone.trim(), city: d.city.trim(), uf: d.uf };
      }
      setUsers(list => [...list, user]);
    }
    function approve(id) {
      const u = users.find(x => x.id === id);
      setUsers(list => list.map(x => x.id === id ? { ...x, status: 'aprovado', reason: undefined } : x));
      if (u && u.blogId) setBlogs(list => list.map(b => b.id === u.blogId && b.status === 'pendente' ? { ...b, status: 'script' } : b));
      notify('Cadastro aprovado. ' + (u ? u.name.split(' ')[0] : 'A pessoa') + ' já pode entrar.');
    }
    function deny(id, reason) {
      const u = users.find(x => x.id === id);
      setUsers(list => list.map(x => x.id === id ? { ...x, status: 'negado', reason } : x));
      if (u && u.blogId) setBlogs(list => list.map(b => b.id === u.blogId ? { ...b, status: 'negado' } : b));
      notify('Cadastro negado.');
    }
    function verifyScript() {
      setBlogger(b => ({ ...b, verified: true }));
      setUsers(list => list.map(x => x.id === meId ? { ...x, scriptVerified: true } : x));
      setBlogs(list => list.map(b => b.id === blogger.blogId && b.status === 'script' ? { ...b, status: 'ativo' } : b));
      setPage('Meus espaços'); top();
      notify('Script encontrado. Seu painel está liberado.');
    }
    function saveBlog(patch) {
      const old = myBlog.name;
      setBlogs(list => list.map(b => b.id === blogger.blogId ? { ...b, ...patch } : b));
      if (patch.name && patch.name !== old) setPayouts(list => list.map(p => p.blog === old ? { ...p, blog: patch.name } : p));
      notify('Blog atualizado');
    }
    const addTxn = (desc, value) => setAdvTxns(m => ({ ...m, [advertiser]: [{ date: TODAY, desc, value }, ...(m[advertiser] || [])] }));
    function publishCampaign(c) {
      setCampaigns(list => [{ id: 'c' + Date.now(), name: c.name, advertiser, objective: c.objective, status: 'revisao', invested: c.total, clicks: 0, results: 0, blogs: c.blogs, blogNames: c.blogNames }, ...list]);
      setAdvBal(m => ({ ...m, [advertiser]: (m[advertiser] || 0) - c.total }));
      addTxn(`${c.name} · ${c.slots} ${c.slots > 1 ? 'espaços' : 'espaço'}`, -c.total);
      setPage('Campanhas');
      notify('Campanha enviada para revisão. O admin aprova antes de ela entrar no ar.');
    }
    function addBalance(v, method, n) {
      setAdvBal(m => ({ ...m, [advertiser]: (m[advertiser] || 0) + v }));
      addTxn('Recarga via ' + (method === 'cartao' ? 'cartão de crédito' + (n > 1 ? ` em ${n}x` : '') : 'Pix'), v);
      notify('Saldo adicionado: ' + money(v));
    }
    function withdraw() {
      setPayouts(list => [{ id: 'r' + Date.now(), blog: myBlog.name, value: bloggerBalance, date: TODAY, status: 'pendente' }, ...list]);
      setBalByBlog(m => ({ ...m, [blogger.blogId]: 0 }));
      notify('Saque solicitado. O valor cai em até 2 dias úteis.');
    }

    const toastEl = h('div', { className: 'app-toast', role: 'status', 'aria-live': 'polite', hidden: !toast }, toast ? toast.msg : '');
    if (screen === 'login') return h('div', { className: 'lp-root' }, h(Login, { users, onLogin: login, onBack: toSite, onSignup: openSignup }), toastEl);
    if (screen === 'cadastro') return h('div', { className: 'lp-root' }, h(Signup, { key: signupRole || 'escolha', users, preset: signupRole, onSignup: signup, onLogin: openLogin, onBack: toSite }), toastEl);
    if (screen !== 'app' || !me) return h('div', { className: 'lp-root' }, h(Landing, { onLogin: openLogin, onSignup: openSignup, blogs }), toastEl);

    const ctx = { go, notify, campaigns, setCampaigns, cart, setCart, balance, blogs, advertiser };
    const screens = {
      anunciante: {
        'Painel': () => h(AdvPainel, ctx),
        'Campanhas': () => h(AdvCampanhas, ctx),
        'Criar campanha': () => h(CreateCampaign, { ...ctx, onPublish: publishCampaign }),
        'Explorar blogs': () => h(AdvExplorar, ctx),
        'Pixel e rastreamento': () => h(AdvPixel, { notify, site: me.company ? me.company.site : '', fresh: !campaigns.some(c => c.advertiser === advertiser) }),
        'Faturamento': () => h(AdvBilling, { balance, txns, onAdd: addBalance, campaigns, billing, advertiser })
      },
      blogueiro: {
        'Painel': () => h(BlogPainel, { mySlots, blog: myBlog, fresh: blogger.fresh }),
        'Meu blog': () => h(BlogMeuBlog, { key: myBlog.id, blog: myBlog, onSave: saveBlog }),
        'Meus espaços': () => h(BlogEspacos, { mySlots, setMySlots, notify, blog: myBlog }),
        'Receita': () => h(BlogReceita, { bloggerBalance, onWithdraw: withdraw, payouts, pct, blog: myBlog, fresh: blogger.fresh }),
        'Insights': () => h(BlogInsights, { blog: myBlog, fresh: blogger.fresh }),
        'Instalar script': () => h(BlogScript, { notify, blog: myBlog, verified: blogger.verified, onVerify: verifyScript })
      },
      admin: {
        'Visão geral': () => h(AdminVisao, { campaigns, setCampaigns, blogs, pct, notify, pendingSignups, go }),
        'Cadastros': () => h(AdminCadastros, { users, blogs, onApprove: approve, onDeny: deny }),
        'Blogs parceiros': () => h(AdminBlogs, { blogs: blogs.map(b => slotsByBlog[b.id] ? { ...b, slots: slotsByBlog[b.id].length } : b) }),
        'Anunciantes': () => h(AdminAnunciantes, { campaigns }),
        'Campanhas': () => h(AdminCampanhas, { campaigns, setCampaigns, notify }),
        'Saques': () => h(AdminSaques, { payouts, setPayouts, notify }),
        'Configurações': () => h(AdminConfig, { pct, setPct, billing, setBilling, notify })
      }
    };
    const screenFn = screens[role][page];
    const navItems = role === 'blogueiro' ? (blogger.verified ? ['Painel', 'Meu blog', 'Meus espaços', 'Receita', 'Insights', 'Instalar script'] : ['Instalar script', 'Meu blog'])
      : role === 'admin' ? ['Visão geral', 'Cadastros', 'Blogs parceiros', 'Anunciantes', 'Campanhas', 'Saques', 'Configurações'] : undefined;
    const first = me.name.split(' ')[0];
    const userLabel = role === 'blogueiro' ? first + ' · ' + myBlog.name : role === 'anunciante' ? first + ' · ' + advertiser : me.name;

    return h('div', { className: 'app-root' },
      h('div', { className: 'app-shell' },
        h('header', { className: 'app-mobilebar' },
          Wordmark(),
          h('button', { type: 'button', className: 'app-burger', 'aria-expanded': menuOpen, 'aria-controls': 'app-nav', 'aria-label': 'Abrir menu', onClick: () => setMenuOpen(true) }, ICON('M4 6h16M4 12h16M4 18h16'))),
        menuOpen ? h('div', { className: 'app-backdrop', onClick: () => setMenuOpen(false) }) : null,
        h('aside', { id: 'app-nav', ref: sideRef, className: 'app-side' + (menuOpen ? ' is-open' : '') },
          h('button', { type: 'button', className: 'app-drawer-close', 'aria-label': 'Fechar menu', onClick: () => setMenuOpen(false) }, ICON('M6 6l12 12M18 6L6 18')),
          h(B.SideNav, { key: role + blogger.verified, role, items: navItems, active: page === 'Criar campanha' ? 'Campanhas' : page, onNavigate: go, onLogout: logout, user: userLabel })),
        h('main', { className: 'app-main', key: role + page }, h(Reveal, null, screenFn ? screenFn() : null))),
      toastEl);
  }
  ReactDOM.createRoot(document.getElementById('app')).render(h(App));
})();

</script>
</body>
</html>
